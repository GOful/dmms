<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>로그인 · 대구교통공사 맨홀관리 시스템(DMMS)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind.config.js"></script>
    <link rel="stylesheet" href="css/login.css">

    <script src="js/mode.js"></script>
    <script src="js/auth-config.js"></script>
</head>
<body class="font-sans text-slate-800">
    <main class="h-screen w-screen flex">

        <!-- 좌측 브랜드 패널 (데스크탑 전용) -->
        <aside class="brand-panel relative hidden lg:flex flex-col justify-between w-[45%] xl:w-[50%] p-12 text-white overflow-hidden">
            <div class="relative z-10 flex items-center gap-3">
                <img src="img/logo.svg" alt="DMMS" class="h-9 w-auto">
                <div class="leading-tight">
                    <div class="text-base font-bold tracking-tight">대구교통공사</div>
                    <div class="text-xs text-slate-400">Daegu Transportation Corp.</div>
                </div>
            </div>
            <div class="relative z-10 max-w-md">
                <div class="inline-flex items-center gap-2 mb-5 px-3 py-1 rounded-full bg-blue-500/15 border border-blue-400/30 text-xs font-medium text-blue-300 tracking-wide">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-400 pulse-dot"></span>
                    SECURE ACCESS
                </div>
                <h2 class="text-4xl xl:text-5xl font-bold leading-tight tracking-tight">
                    맨홀관리 시스템<br>
                    <span class="text-blue-400">DMMS</span>
                </h2>
            </div>
            <div class="relative z-10 text-xs text-slate-500">&copy; 2026 Electric Conversion Team · All rights reserved.</div>
        </aside>

        <!-- 우측 로그인 영역 -->
        <section class="flex-1 flex items-center justify-center px-6 py-10 bg-slate-50">
            <div class="w-full max-w-[380px]">

                <!-- 모바일 로고 (좌측 패널이 숨겨질 때) -->
                <div class="lg:hidden flex items-center gap-3 mb-10">
                    <img src="img/logo.svg" alt="DMMS" class="h-8 w-auto">
                    <div class="leading-tight">
                        <div class="text-sm font-bold text-slate-800">대구교통공사</div>
                        <div class="text-[11px] text-slate-500">맨홀관리 시스템 (DMMS)</div>
                    </div>
                </div>

                <div id="login-card">
                    <!-- 관리자 로그인 -->
                    <div class="rounded-xl border border-slate-200 bg-white p-5 mb-5">
                        <div class="flex items-center gap-2.5 mb-4">
                            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-900 text-white">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                            </span>
                            <div id="admin-card-title" class="text-sm font-bold text-slate-900">관리자 로그인</div>
                        </div>

                        <!-- 로컬 개발 환경 전용: 비밀번호 없이 접속 -->
                        <a id="local-entry" href="index.html?mode=admin" class="cta hidden w-full flex items-center justify-center gap-2 py-3 rounded-lg text-sm">
                            관리자 페이지 접속
                        </a>

                        <form id="login-form" autocomplete="off">
                            <label for="password" class="block text-xs font-semibold text-slate-700 mb-2 tracking-wide">비밀번호</label>
                            <div class="relative">
                                <input id="password" type="password" required placeholder="관리자 비밀번호"
                                    class="field w-full pl-4 pr-11 py-3 rounded-lg text-sm">
                                <button type="button" id="toggle-password" aria-label="비밀번호 표시" class="eye-btn absolute inset-y-0 right-0 flex items-center pr-3">
                                    <svg id="eye-open" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg id="eye-closed" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.4 19.4 0 0 1 4.22-5.19"/><path d="M1 1l22 22"/>
                                        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a19.5 19.5 0 0 1-2.17 3.22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    </svg>
                                </button>
                            </div>
                            <button id="submit-btn" type="submit" class="cta w-full flex items-center justify-center gap-2 py-3 rounded-lg text-sm mt-4">
                                <span id="submit-label">로그인</span>
                                <span id="submit-spinner" class="spinner hidden"></span>
                            </button>
                            <p id="error-msg" class="hidden text-xs text-red-600 bg-red-50 border border-red-100 px-3 py-2.5 rounded-lg mt-3"></p>
                        </form>
                    </div>

                    <div class="flex items-center gap-3 my-5">
                        <div class="flex-1 h-px bg-slate-200"></div>
                        <span class="text-[11px] text-slate-400 tracking-widest">OR</span>
                        <div class="flex-1 h-px bg-slate-200"></div>
                    </div>

                    <!-- 시연 페이지 -->
                    <a href="index.html?mode=demo" class="group block rounded-xl border border-slate-200 hover:border-slate-400 bg-white hover:bg-slate-50 p-5 transition-colors">
                        <div class="flex items-center gap-3">
                            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-900 text-white shrink-0">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                            </span>
                            <div class="flex-1 text-sm font-bold text-slate-900">시연 페이지 둘러보기</div>
                            <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-700 group-hover:translate-x-0.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </div>
                    </a>
                </div>

                <div class="lg:hidden mt-12 text-center text-[11px] text-slate-400">&copy; 2026 Electric Conversion Team</div>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
