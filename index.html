<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>대구교통공사 맨홀관리 시스템(DMMS)</title>

    <!-- 모드 판별 → 배포 시 생성되는 인증 설정 → 접근 제어 (화면이 그려지기 전에 실행) -->
    <script src="js/mode.js"></script>
    <script src="js/auth-config.js"></script>
    <script src="js/auth-guard.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="js/tailwind.config.js"></script>
    <!-- PDF.js (사용매뉴얼 뷰어) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-50 text-slate-800 flex flex-col font-sans">

    <!-- ========== 상단 내비게이션 ========== -->
    <nav class="bg-slate-900 text-white h-16 flex items-center justify-between px-4 shadow-lg z-[60] shrink-0 relative">
        <div class="flex items-center gap-3">
            <img src="img/logo.svg" alt="DMMS" class="h-8 w-auto">
            <span class="text-lg font-bold tracking-tight text-slate-100">
                대구교통공사 맨홀관리 시스템 <span class="font-light text-slate-400">(DMMS)</span>
            </span>
        </div>
        <div class="flex items-center gap-4 h-full">
            <!-- 메뉴 · 모드 뱃지 · 로그인/로그아웃 (js/ui/menu.js 가 채움) -->
            <ul id="desktop-menu" class="hidden md:flex gap-1 h-full"></ul>
            <div id="header-actions" class="hidden md:flex items-center gap-3 ml-3"></div>
            <button id="mobile-menu-open-btn" class="md:hidden text-2xl p-1 text-slate-300 hover:text-white transition-colors" aria-label="전체 메뉴">☰</button>
        </div>
    </nav>

    <!-- ========== 본문 ========== -->
    <div id="app-container" class="group sidebar-hidden flex flex-1 overflow-hidden relative">

        <!-- 사이드바 (맨홀 목록) -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 absolute z-40 h-full shadow-xl group-[.sidebar-hidden]:-translate-x-full">
            <div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-slate-700">관리맨홀 목록</div>
            <div id="tree-container" class="flex-1 overflow-y-auto p-2"></div>
            <footer class="p-3 text-center text-xs text-slate-400 border-t border-slate-100 bg-slate-50">
                &copy; 2026 Copyright Electric Conversion Team
            </footer>
        </aside>

        <!-- 지도 영역 -->
        <main id="main-content" class="flex-1 flex flex-col relative w-full bg-slate-200">

            <!-- 사이드바 열기/닫기 -->
            <button id="sidebar-toggle-btn" class="absolute top-4 left-80 z-50 bg-slate-800 p-2 rounded-lg shadow-lg border border-slate-700 text-white hover:bg-slate-700 hover:text-blue-300 transition-all duration-300 group-[.sidebar-hidden]:left-4">
                <svg class="group-[.sidebar-hidden]:hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                <span class="hidden group-[.sidebar-hidden]:block text-xs font-bold px-1 whitespace-nowrap">목록펼치기</span>
            </button>

            <!-- 지도 컨트롤 패널 (모바일은 접힌 상태로 시작) -->
            <div id="map-controls" class="group/controls absolute top-4 right-4 z-20 bg-white p-3 max-md:p-2 rounded-xl shadow-xl border border-slate-300 flex flex-col gap-3 md:min-w-[180px]">
                <button type="button" id="map-controls-toggle" aria-expanded="false" aria-controls="map-controls-body"
                    class="flex items-center justify-center gap-1.5 md:cursor-default md:pointer-events-none md:border-b md:border-slate-200 md:pb-2 group-[.expanded]/controls:border-b group-[.expanded]/controls:border-slate-200 group-[.expanded]/controls:pb-2">
                    <span id="datetime-display" class="text-sm font-bold text-slate-700 tabular-nums"></span>
                    <svg class="md:hidden w-4 h-4 text-slate-500 transition-transform group-[.expanded]/controls:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div id="map-controls-body" class="max-md:hidden flex flex-col gap-2 text-sm text-slate-600">
                    <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600 transition-colors">
                        <input type="checkbox" id="traffic-checkbox" class="accent-blue-600 w-4 h-4">
                        <svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                        실시간 교통정보
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600 transition-colors">
                        <input type="checkbox" id="weather-checkbox" class="accent-blue-600 w-4 h-4">
                        <svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
                        현재 날씨
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600 transition-colors">
                        <input type="checkbox" id="roadview-checkbox" class="accent-blue-600 w-4 h-4">
                        <svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        로드뷰
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600 transition-colors">
                        <input type="checkbox" id="location-checkbox" class="accent-blue-600 w-4 h-4">
                        <svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        내 위치 표시
                        <svg id="location-loading" class="hidden animate-spin h-4 w-4 text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>
                    </label>
                </div>
            </div>

            <!-- AI 지도 필터 해제 (필터 중에만 표시) -->
            <div id="map-filter-control" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-30 animate-[fadeIn_0.3s_ease-out]">
                <button id="reset-filter-btn" class="bg-slate-800/90 backdrop-blur text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2 hover:bg-slate-700 transition-all hover:scale-105 border border-slate-600">
                    <svg class="h-4 w-4 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span class="text-sm font-bold">필터 해제 (전체 보기)</span>
                </button>
            </div>

            <div id="map" class="flex-1 w-full h-full"></div>
            <!-- 지도 ↕ 로드뷰 높이 조절 -->
            <div id="map-resizer" class="hidden h-2 bg-slate-300 hover:bg-blue-400 cursor-row-resize touch-none z-30 transition-colors"></div>
            <div id="roadview" class="hidden h-1/3 w-full bg-slate-800 relative z-20 border-t border-slate-300"></div>
        </main>

        <!-- AI 대화창 -->
        <div id="chat-container" class="fixed bottom-24 right-6 w-96 max-w-[90vw] h-[500px] max-h-[70vh] bg-white rounded-2xl shadow-2xl border border-slate-100 flex flex-col z-50 transition-all duration-300 opacity-0 translate-y-4 scale-95 invisible [&.show]:opacity-100 [&.show]:translate-y-0 [&.show]:scale-100 [&.show]:visible">
            <div class="bg-slate-900 p-4 rounded-t-2xl flex justify-between items-center text-white">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    <span class="font-medium">AI 대화창</span>
                </div>
                <button id="chat-close-btn" class="text-slate-400 hover:text-white" aria-label="닫기">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                </button>
            </div>
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 flex flex-col">
                <div class="self-start bg-white border border-slate-200 text-slate-600 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] text-sm">
                    안녕하세요! 맨홀관리 AI입니다. 무엇을 도와드릴까요?
                </div>
            </div>
            <div class="p-3 bg-white border-t border-slate-100 rounded-b-2xl">
                <div class="relative flex gap-2">
                    <input type="text" id="chat-input" placeholder="질문을 입력하세요..." autocomplete="off" class="flex-1 bg-slate-100 border-0 rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none">
                    <button id="chat-send-btn" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-xl transition-colors shadow-sm" aria-label="보내기">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- AI 대화창 열기 -->
        <button id="chat-toggle-btn" class="fixed bottom-8 right-8 z-50 group/chat" aria-label="AI 대화창">
            <div class="w-16 h-16 rounded-full flex items-center justify-center shadow-2xl text-white transition-transform group-hover/chat:scale-110 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-[length:200%_200%] animate-gradient-flow border-2 border-white/30">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    <text x="12" y="14" font-size="10" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold" font-family="sans-serif">AI</text>
                </svg>
            </div>
        </button>
    </div>

    <!-- ========== 공용 모달 (메뉴 화면 · 맨홀 상세정보) ========== -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 z-[60] justify-center items-center backdrop-blur-sm">
        <div class="bg-white w-[800px] max-w-[95%] rounded-xl shadow-2xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg"></h3>
                <button id="modal-close-btn" class="text-slate-400 hover:text-white text-2xl leading-none" aria-label="닫기">&times;</button>
            </div>
            <div id="modal-body" class="p-6 max-h-[70vh] overflow-y-auto text-slate-700 leading-relaxed"></div>
        </div>
    </div>

    <!-- ========== 모바일 메뉴 (오른쪽 서랍) ========== -->
    <div id="mobile-menu" class="hidden relative z-[100]">
        <div id="mobile-menu-backdrop" class="fixed inset-0 bg-black/50 transition-opacity duration-300 opacity-0"></div>
        <div id="mobile-menu-panel" class="fixed inset-y-0 right-0 w-72 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
            <div class="flex items-center justify-between p-4 border-b border-slate-100 bg-slate-50">
                <h2 class="text-lg font-bold text-slate-800">전체 메뉴</h2>
                <button id="mobile-menu-close-btn" class="p-2 text-slate-500 hover:text-slate-700 rounded-full hover:bg-slate-200 transition-colors" aria-label="닫기">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <nav id="mobile-menu-list" class="flex-1 overflow-y-auto py-4 px-2 space-y-1"></nav>
        </div>
    </div>

    <!-- 카카오맵 SDK → 앱 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bfdc537ae38f2581f61b334ea4034de6&libraries=services"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
