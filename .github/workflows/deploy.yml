name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # 수동 실행 버튼 활성화
  schedule:
    - cron: '0 * * * *' # 매 시간 정각마다 자동 실행 (날씨 데이터 갱신용)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. JS용 API 키 파일 생성 (GitHub Secrets 사용)
      - name: Create API Key File
        run: |
          echo "export const GOOGLE_API_KEY = '${{ secrets.GOOGLE_API_KEY }}';" > js/apikey.js

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 의존성 설치 및 날씨 데이터 갱신 스크립트 실행
      # .env 파일 대신 환경 변수로 KMA_API_KEY를 직접 주입합니다.
      - name: Fetch Weather Data
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          pip install requests python-dotenv
          python fetch_weather.py

      # [추가] 갱신된 날씨 데이터를 저장소에 커밋 및 푸시
      - name: Commit and Push Weather Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weather_data.json
          # [skip ci]를 추가하여 무한 배포 루프 방지
          git commit -m "chore(data): update weather_data.json [skip ci]" || echo "No changes to commit"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4