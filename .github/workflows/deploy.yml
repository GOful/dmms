# GitHub Pages 배포
#   - main 에 push 할 때, 매시간 정각(날씨 갱신), 수동 실행(Actions > Run workflow) 시 실행
#   - 저장소에 60일간 커밋이 없으면 GitHub 가 이 워크플로를 자동으로 끈다 → Actions 화면에서 다시 켜야 함
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # AI 챗봇용 Google API 키 (Secrets: GOOGLE_API_KEY) → js/apikey.js
      - name: Create API key file
        run: |
          echo "export const GOOGLE_API_KEY = '${{ secrets.GOOGLE_API_KEY }}';" > js/apikey.js

      # 관리자 비밀번호 (Secrets: SITE_PASSWORD) → PBKDF2-SHA256 해시만 js/auth-config.js 에 기록
      - name: Create auth config file
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD secret is not set. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          python - <<'PYEOF'
          import hashlib, os
          salt, iters = 'dmms-v1', 200000
          h = hashlib.pbkdf2_hmac('sha256', os.environ['SITE_PASSWORD'].encode('utf-8'), salt.encode(), iters).hex()
          with open('js/auth-config.js', 'w', encoding='utf-8') as f:
              f.write(f"window.__AUTH_SALT='{salt}';window.__AUTH_ITERS={iters};window.__AUTH_HASH='{h}';")
          PYEOF

      # 맨홀이력 엑셀 → 웹 데이터 (엑셀만 고쳐 push 해도 반영되도록)
      - name: Build manhole history
        run: python scripts/build_manhole_history.py

      # 기상청 실황 → 날씨 데이터 (Secrets: KMA_API_KEY, 커밋하지 않고 배포본에만 포함)
      - name: Fetch weather data
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          TZ: 'Asia/Seoul'
        run: |
          pip install requests
          python scripts/fetch_weather.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
